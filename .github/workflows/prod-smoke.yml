name: Production smoke test

# Deploys are done manually. Run this after a deploy to verify production
# (Actions → "Production smoke test" → Run workflow → paste the production URL).
on:
  workflow_dispatch:
    inputs:
      url:
        description: Production base URL, e.g. https://www.example.com
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/smoke.spec.ts
        env:
          BASE_URL: ${{ inputs.url }}
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
