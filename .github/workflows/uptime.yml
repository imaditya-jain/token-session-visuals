name: Uptime check

# Read-only probe of production. It does nothing until the repository variable PROD_URL is set
# (Settings → Secrets and variables → Actions → Variables), e.g. https://www.example.com.
# A failed run emails the people watching the repository's Actions, which is the alert.
# READINESS_SECRET (same value as the server's CRON_SECRET) is optional: when present the database is checked too.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: ${{ vars.PROD_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Liveness
        run: |
          curl --fail --silent --show-error --max-time 15 --retry 3 --retry-delay 10 --retry-all-errors \
            "${PROD_URL%/}/api/health"
        env:
          PROD_URL: ${{ vars.PROD_URL }}
      - name: Home page renders
        run: |
          curl --fail --silent --show-error --max-time 20 --retry 3 --retry-delay 10 --retry-all-errors \
            --output /dev/null "${PROD_URL%/}/"
        env:
          PROD_URL: ${{ vars.PROD_URL }}
      - name: Readiness (database)
        if: ${{ env.READINESS_SECRET != '' }}
        run: |
          curl --fail --silent --show-error --max-time 20 --retry 3 --retry-delay 10 --retry-all-errors \
            --header "Authorization: Bearer ${READINESS_SECRET}" "${PROD_URL%/}/api/health/ready"
        env:
          PROD_URL: ${{ vars.PROD_URL }}
          READINESS_SECRET: ${{ secrets.READINESS_SECRET }}
